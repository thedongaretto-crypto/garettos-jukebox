name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk GarettosJukebox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GarettosJukebox
          path: GarettosJukebox.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GarettosJukebox.apk --title "Garetto's Jukebox" --notes "Latest build. Download GarettosJukebox.apk on your phone and tap it to install."
